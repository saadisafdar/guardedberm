<main class="container page-shell" style="max-width: 980px"><div class="page-header mb-4"><p class="card-kicker mb-1">Account controls</p><h1 class="h2 fw-bold mb-0">Profile & geofence settings</h1></div><div class="row g-4"><section class="col-12 col-md-6"><div class="card-sharp p-4 h-100"><h2 class="h5 fw-bold mb-1">Account profile</h2><p class="text-muted small mb-4">Keep your responder contact details current.</p><form onsubmit="event.preventDefault(); document.getElementById('profile-status').textContent='Profile changes saved.'"><label class="form-label fw-semibold" for="name">Full name</label><input id="name" class="form-control mb-3" value="Saadi Safdar" required><label class="form-label fw-semibold" for="email">Email address</label><input id="email" class="form-control mb-4" type="email" value="saadi@example.com" readonly><button class="btn btn-accent w-100 py-2">Save profile changes</button><p id="profile-status" class="text-success fw-semibold mt-3 mb-0" aria-live="polite"></p></form></div></section><section class="col-12 col-md-6"><div class="card-sharp p-4 h-100"><h2 class="h5 fw-bold mb-1">Saved Home coordinates</h2><p class="text-muted small mb-4">Used for 5 km Haversine proximity calculations.</p><form onsubmit="event.preventDefault(); document.getElementById('location-status').textContent='Geofence coordinates updated.'"><label class="form-label fw-semibold" for="latitude">Home latitude</label><input id="latitude" class="form-control mb-3" type="number" step="any" value="33.7833" required><label class="form-label fw-semibold" for="longitude">Home longitude</label><input id="longitude" class="form-control mb-4" type="number" step="any" value="72.7167" required><button class="btn btn-outline-navy w-100 py-2">Update alert coordinates</button><p id="location-status" class="text-success fw-semibold mt-3 mb-0" aria-live="polite"></p></form></div></section></div></main>
