<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile | GuardedBerm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="image_1.png" width="32" height="32" alt="">Guarded<span>Berm</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto gap-lg-2"><li><a class="nav-link" href="dashboard.html">Dashboard</a></li><li><a class="nav-link" href="saferoute.html">Safe Route</a></li><li><a class="nav-link" href="report.html">Report Hazard</a></li><li><a class="nav-link" href="feed.html">Hazard Feed</a></li><li><a class="nav-link" href="alerts.html">Alerts</a></li><li><a class="nav-link active" href="profile.html">Profile</a></li></ul></div></nav>
<main class="container page-shell" style="max-width:980px"><div class="page-header mb-4"><p class="card-kicker mb-1">Account controls</p><h1 class="h2 fw-bold mb-0">Profile &amp; geofence settings</h1></div><div class="row g-4"><section class="col-12 col-md-6"><div class="card-sharp p-4 h-100"><h2 class="h5 fw-bold">Account profile</h2><form id="profile-form"><label class="form-label fw-semibold" for="name">Full name</label><input id="name" class="form-control mb-3" required><label class="form-label fw-semibold" for="email">Email address</label><input id="email" class="form-control mb-4" type="email" required><button class="btn btn-accent w-100">Save profile changes</button><p id="profile-status" class="text-success fw-semibold mt-3 mb-0"></p></form></div></section><section class="col-12 col-md-6"><div class="card-sharp p-4 h-100"><h2 class="h5 fw-bold">Saved Home coordinates</h2><p class="text-muted small">Used for 5 km Haversine proximity calculations.</p><form id="coords-form"><label class="form-label fw-semibold" for="latitude">Home latitude</label><input id="latitude" class="form-control mb-3" type="number" step="any" required><label class="form-label fw-semibold" for="longitude">Home longitude</label><input id="longitude" class="form-control mb-4" type="number" step="any" required><button class="btn btn-outline-navy w-100">Update alert coordinates</button><p id="location-status" class="text-success fw-semibold mt-3 mb-0"></p></form></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script><script>
  const coords = GuardedBerm.getCoords(); document.getElementById('latitude').value = coords.lat; document.getElementById('longitude').value = coords.lon; const profile = JSON.parse(localStorage.getItem('guardedberm_profile') || '{}'); document.getElementById('name').value = profile.name || ''; document.getElementById('email').value = profile.email || '';
  document.getElementById('profile-form').addEventListener('submit', event => { event.preventDefault(); localStorage.setItem('guardedberm_profile', JSON.stringify({ name: document.getElementById('name').value.trim(), email: document.getElementById('email').value.trim() })); document.getElementById('profile-status').textContent = 'Profile changes saved.'; });
  document.getElementById('coords-form').addEventListener('submit', event => { event.preventDefault(); try { GuardedBerm.saveCoords(document.getElementById('latitude').value, document.getElementById('longitude').value); document.getElementById('location-status').textContent = 'Geofence coordinates updated.'; } catch (error) { GuardedBerm.showToast(error.message); } });
</script></body></html>
