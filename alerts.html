<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alerts | GuardedBerm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="image_1.png" width="32" height="32" alt="">Guarded<span>Berm</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto gap-lg-2"><li><a class="nav-link" href="dashboard.html">Dashboard</a></li><li><a class="nav-link" href="saferoute.html">Safe Route</a></li><li><a class="nav-link" href="report.html">Report Hazard</a></li><li><a class="nav-link" href="feed.html">Hazard Feed</a></li><li><a class="nav-link active" href="alerts.html">Alerts</a></li><li><a class="nav-link" href="profile.html">Profile</a></li></ul></div></nav>
<main class="container page-shell" style="max-width:900px"><div class="page-header mb-4"><p class="card-kicker mb-1">Proximity intelligence</p><h1 class="h2 fw-bold mb-0">Your alerts</h1></div><div class="alert-banner p-4 mb-4 d-flex flex-column flex-sm-row justify-content-between gap-3 align-items-sm-center"><div><h2 class="h6 text-accent fw-bold mb-1">5 KM GEOFENCE MONITORING ACTIVE</h2><p id="weather-summary" class="small text-white-50 mb-0">Loading live weather conditions...</p></div><span class="badge badge-risk-low px-3 py-2">LIVE</span></div><div class="card-sharp p-3 mb-4"><div class="d-flex justify-content-between"><strong>Current conditions</strong><span id="alert-weather-value" class="text-accent">Loading...</span></div><small id="alert-weather-details" class="text-muted">Temperature · precipitation · wind</small></div><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Notification history</h2><button id="refresh-alerts" class="btn btn-outline-navy btn-sm">Refresh live feeds</button></div><div id="alerts-list" class="d-grid gap-3"></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script><script>
  const { getCoords, getAlerts, addAlert, dismissAlert, fetchWeather, fetchEarthquakes, haversineDistance, showToast, escapeHtml } = GuardedBerm;
  const list = document.getElementById('alerts-list');
  function renderAlerts() { const alerts = getAlerts().filter(alert => !alert.dismissed); list.innerHTML = alerts.length ? alerts.map(alert => `<article class="card-sharp p-4 border-start border-4 ${alert.severity === 'critical' ? 'border-danger' : 'border-warning'}"><div class="d-flex justify-content-between gap-2"><span class="badge ${alert.severity === 'critical' ? 'badge-risk-critical' : 'badge-risk-moderate'}">${escapeHtml(alert.title)}</span><button class="btn btn-sm btn-outline-secondary dismiss-alert" data-id="${escapeHtml(alert.id)}">Dismiss</button></div><h3 class="h6 fw-bold mt-3">${escapeHtml(alert.message)}</h3><small class="text-muted">${new Date(alert.createdAt).toLocaleString()}</small></article>`).join('') : '<div class="card-sharp p-5 text-center text-muted empty-state">No active notifications.</div>'; }
  list.addEventListener('click', event => { if (event.target.dataset.id) { dismissAlert(event.target.dataset.id); renderAlerts(); } });
  async function loadAlerts() { const coords = getCoords(); try { const weather = await fetchWeather(coords); const current = weather.current; document.getElementById('alert-weather-value').textContent = `${current.temperature_2m}°C`; document.getElementById('alert-weather-details').textContent = `Precipitation ${current.precipitation} mm/h · Wind ${current.wind_speed_10m} km/h`; document.getElementById('weather-summary').textContent = `Live conditions at ${coords.lat.toFixed(4)}, ${coords.lon.toFixed(4)} · ${current.precipitation} mm/h precipitation`; if (current.precipitation >= 5) addAlert({ id: `weather-${new Date().toISOString().slice(0, 13)}`, severity: 'critical', title: 'CRITICAL WEATHER WARNING', message: `Heavy precipitation detected: ${current.precipitation} mm/h.` }); else if (current.precipitation > 0) addAlert({ id: `weather-${new Date().toISOString().slice(0, 13)}`, severity: 'moderate', title: 'MODERATE WEATHER WARNING', message: `Rain detected near your saved location: ${current.precipitation} mm/h.` }); } catch (error) { document.getElementById('alert-weather-value').textContent = 'Data Unavailable'; document.getElementById('alert-weather-details').textContent = 'Data Unavailable'; showToast('Network error fetching live weather.', 'danger'); } try { const data = await fetchEarthquakes(); (data.features || []).forEach(event => { const coordinates = event.geometry.coordinates; const distance = haversineDistance(coords.lat, coords.lon, coordinates[1], coordinates[0]); if (distance <= 100) addAlert({ id: `quake-${event.id}`, severity: event.properties.mag >= 5 ? 'critical' : 'moderate', title: 'SEISMIC PROXIMITY WARNING', message: `M ${event.properties.mag.toFixed(1)} earthquake ${distance.toFixed(1)} km away: ${event.properties.place || 'Unknown location'}.` }); }); } catch (error) { showToast('Network error fetching live seismic feed.', 'danger'); } renderAlerts(); }
  document.getElementById('refresh-alerts').addEventListener('click', loadAlerts); loadAlerts();
</script></body></html>
