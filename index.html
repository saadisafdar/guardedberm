<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardedBerm — Access Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light m-0 p-0">
  <nav class="navbar navbar-dark position-absolute top-0 end-0 p-3 z-3" aria-label="Portal navigation">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#portalNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse position-absolute end-0 mt-2" id="portalNav">
      <a class="btn btn-accent text-nowrap" href="dashboard.html">View demo station</a>
    </div>
  </nav>

  <main class="container-fluid min-vh-100 p-0">
    <div class="row g-0 min-vh-100">
      <section class="col-12 col-lg-5 brand-panel d-flex flex-column justify-content-between p-4 p-md-5">
        <div class="brand-header text-center">
          <div class="mb-3 d-flex justify-content-center">
            <img src="image_1.png" alt="GuardedBerm logo" class="brand-logo" style="width: 90px; height: 90px; object-fit: contain;">
          </div>
          <div class="brand-title-box">
            <h1 class="fw-bold text-white mb-1">Guarded<span>Berm</span></h1>
            <p class="brand-subtitle mb-0">AI-Driven Disaster Monitoring &amp; Safe-Navigation Platform.</p>
          </div>
        </div>
        <div class="quote-box my-3 text-center text-lg-start">
          <p class="quote-text text-uppercase m-0">Protected.<br>Intelligent.<br>Secure.</p>
        </div>
        <div class="brand-footer text-uppercase text-center text-lg-start">© 2026 GuardedBerm Team. Academic Group Project.</div>
      </section>

      <section class="col-12 col-lg-7 form-panel d-flex align-items-center justify-content-center p-4 p-md-5 bg-white">
        <div class="form-wrapper w-100" style="max-width: 480px;">
          <div class="tab-switcher d-flex border-bottom border-2 mb-4">
            <button class="tab-btn active flex-fill py-3 border-0 bg-transparent fw-bold" type="button" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn flex-fill py-3 border-0 bg-transparent fw-bold" type="button" onclick="switchTab('signup')">Register</button>
          </div>

          <div id="login-section" class="form-section active">
            <form action="dashboard.html">
              <div class="mb-3">
                <label for="login-email" class="form-label fw-semibold">Email Address</label>
                <input type="email" id="login-email" class="form-control py-2 px-3 shadow-none" required placeholder="name@example.com">
              </div>
              <div class="mb-4">
                <label for="login-password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <input type="password" id="login-password" class="form-control py-2 px-3 shadow-none border-end-0" required placeholder="••••••••">
                  <button class="btn btn-outline-secondary px-3 border-start-0 bg-white text-muted" type="button" onclick="togglePassword('login-password', this)" aria-label="Show password">👁</button>
                </div>
              </div>
              <button type="submit" class="submit-btn btn w-100 py-3 text-white fw-bold">Access Dashboard</button>
            </form>
          </div>

          <div id="signup-section" class="form-section">
            <form id="signup-form" action="dashboard.html">
              <div class="mb-3">
                <label for="signup-name" class="form-label fw-semibold">Full Name</label>
                <input type="text" id="signup-name" class="form-control py-2 px-3 shadow-none" required placeholder="John Doe">
              </div>
              <div class="mb-3">
                <label for="signup-email" class="form-label fw-semibold">Email Address</label>
                <input type="email" id="signup-email" class="form-control py-2 px-3 shadow-none" required placeholder="name@example.com">
              </div>
              <div class="mb-3">
                <label for="signup-password" class="form-label fw-semibold">Create Password</label>
                <div class="input-group">
                  <input type="password" id="signup-password" class="form-control py-2 px-3 shadow-none border-end-0" minlength="8" required placeholder="••••••••">
                  <button class="btn btn-outline-secondary px-3 border-start-0 bg-white text-muted" type="button" onclick="togglePassword('signup-password', this)" aria-label="Show password">👁</button>
                </div>
              </div>
              <div class="mb-4">
                <label for="signup-confirm-password" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <input type="password" id="signup-confirm-password" class="form-control py-2 px-3 shadow-none border-end-0" required placeholder="••••••••">
                  <button class="btn btn-outline-secondary px-3 border-start-0 bg-white text-muted" type="button" onclick="togglePassword('signup-confirm-password', this)" aria-label="Show password">👁</button>
                </div>
                <div id="signup-message" class="small text-danger mt-1" aria-live="polite"></div>
              </div>
              <button type="submit" class="submit-btn btn w-100 py-3 text-white fw-bold">Create Account</button>
            </form>
          </div>

          <div class="form-footer-text text-center mt-4 text-muted small">Protected by GuardedBerm Security &amp; Risk Engine</div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function switchTab(tab) {
      const login = document.getElementById('login-section');
      const signup = document.getElementById('signup-section');
      const buttons = document.querySelectorAll('.tab-btn');
      const showLogin = tab === 'login';
      login.classList.toggle('active', showLogin);
      signup.classList.toggle('active', !showLogin);
      buttons[0].classList.toggle('active', showLogin);
      buttons[1].classList.toggle('active', !showLogin);
    }

    function togglePassword(id, button) {
      const input = document.getElementById(id);
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      button.textContent = visible ? '👁' : '🙈';
      button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    }

    document.getElementById('signup-form').addEventListener('submit', event => {
      const password = document.getElementById('signup-password').value;
      const confirmation = document.getElementById('signup-confirm-password').value;
      const message = document.getElementById('signup-message');
      if (password !== confirmation) {
        event.preventDefault();
        message.textContent = 'Passwords do not match.';
      } else {
        message.textContent = '';
      }
    });
  </script>
</body>
</html>
