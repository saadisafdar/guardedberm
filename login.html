<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuardedBerm — Access Portal</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light m-0 p-0">
  <main class="container-fluid min-vh-100 p-0">
    <div class="row g-0 min-vh-100">
      <section class="col-12 col-lg-5 brand-panel d-flex flex-column justify-content-between p-4 p-md-5">
        <div class="text-center">
          <img src="logo.png" alt="GuardedBerm logo" style="width: 90px; height: 90px; object-fit: contain;">
          <h1 class="fw-bold text-white mt-3 mb-1">Guarded<span>Berm</span></h1>
          <p class="text-white-50 mb-0">AI-Driven Disaster Monitoring &amp; Safe-Navigation Platform.</p>
        </div>
        <div class="my-3 text-center text-lg-start">
          <blockquote class="m-0">Protected.<br>Intelligent.<br>Secure.</blockquote>
        </div>
        <div class="text-white-50 text-uppercase text-center text-lg-start small">© 2026 GuardedBerm Team.</div>
      </section>

      <section class="col-12 col-lg-7 form-panel d-flex align-items-center justify-content-center p-4 p-md-5 bg-white">
        <div class="auth-card w-100" style="max-width: 480px;">
          <div class="tab-switcher d-flex border-bottom border-2 mb-4">
            <button class="tab-btn active flex-fill py-3 border-0 bg-transparent fw-bold" type="button" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn flex-fill py-3 border-0 bg-transparent fw-bold" type="button" onclick="switchTab('signup')">Register</button>
          </div>

          <div id="login-section" class="form-section active">
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label fw-semibold" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control py-2 px-3" required placeholder="name@example.com">
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="login-pass">Password</label>
                <div class="input-group">
                  <input type="password" id="login-pass" class="form-control py-2 px-3 border-end-0" required placeholder="••••••••">
                  <button class="password-toggle" type="button" onclick="togglePassword('login-pass', this)" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-accent w-100 py-3">Access Dashboard</button>
              <p id="login-msg" class="small text-danger mt-2 mb-0" role="alert"></p>
            </form>
          </div>

          <div id="signup-section" class="form-section">
            <form id="signup-form" action="dashboard.html">
              <div class="mb-3">
                <label class="form-label fw-semibold" for="signup-name">Full Name</label>
                <input type="text" id="signup-name" class="form-control py-2 px-3" required placeholder="John Doe">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="signup-email">Email Address</label>
                <input type="email" id="signup-email" class="form-control py-2 px-3" required placeholder="name@example.com">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="signup-pass">Create Password</label>
                <div class="input-group">
                  <input type="password" id="signup-pass" class="form-control py-2 px-3 border-end-0" minlength="8" required placeholder="••••••••">
                  <button class="password-toggle" type="button" onclick="togglePassword('signup-pass', this)" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                  </button>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="signup-confirm">Confirm Password</label>
                <div class="input-group">
                  <input type="password" id="signup-confirm" class="form-control py-2 px-3 border-end-0" required placeholder="••••••••">
                  <button class="password-toggle" type="button" onclick="togglePassword('signup-confirm', this)" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                  </button>
                </div>
                <div id="signup-msg" class="small text-danger mt-1"></div>
              </div>
              <button type="submit" class="btn btn-accent w-100 py-3">Create Account</button>
            </form>
          </div>

          <div class="text-center mt-4 text-muted small">Protected by GuardedBerm Security</div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    function switchTab(tab) {
      GuardedBerm.toggleClass('login-section', 'active', tab === 'login');
      GuardedBerm.toggleClass('signup-section', 'active', tab === 'signup');
      document.querySelectorAll('.tab-btn')[0].classList.toggle('active', tab === 'login');
      document.querySelectorAll('.tab-btn')[1].classList.toggle('active', tab === 'signup');
    }
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input || !btn) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('is-visible', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    }
    async function startSession(name, email, password, messageElement) {
      const setMessage = message => { if (messageElement) messageElement.textContent = message; };
      try {
        const users = GuardedBerm.getJson('guardedberm_users', []);
        const userList = Array.isArray(users) ? users : [];
        let user = userList.find(item => item.email === email);
        if (user) {
          const enteredHash = await GuardedBerm.hashPassword(password, user.passwordSalt);
          if (enteredHash !== user.passwordHash) {
            setMessage('The password does not match this saved account.');
            return;
          }
        } else {
          const passwordSalt = GuardedBerm.createPasswordSalt();
          user = { name, email, passwordSalt, passwordHash: await GuardedBerm.hashPassword(password, passwordSalt) };
          userList.push(user);
          if (!GuardedBerm.setJson('guardedberm_users', userList)) {
            setMessage('Unable to save account details in this browser.');
            return;
          }
        }
        const profile = { name: user.name || name, email };
        if (!GuardedBerm.setValue('guardedberm_session_active', 'true') ||
          !GuardedBerm.setJson('guardedberm_profile', profile)) {
          setMessage('Unable to start a session in this browser.');
          return;
        }
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error('Unable to start account session.', error);
        setMessage(error.message || 'Unable to start a session.');
      }
    }
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const profile = GuardedBerm.getJson('guardedberm_profile', {}) || {};
      startSession(profile.name || email.split('@')[0], email, document.getElementById('login-pass').value, document.getElementById('login-msg'));
    });
    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const pass = document.getElementById('signup-pass').value;
      const confirm = document.getElementById('signup-confirm').value;
      const msg = document.getElementById('signup-msg');
      if (pass !== confirm) { e.preventDefault(); msg.textContent = 'Passwords do not match.'; }
      else {
        msg.textContent = '';
        startSession(
          document.getElementById('signup-name').value.trim(),
          document.getElementById('signup-email').value.trim(),
          pass,
          msg
        );
      }
    });
  </script>
</body>
</html>
