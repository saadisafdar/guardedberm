<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hazard Feed | GuardedBerm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="image_1.png" width="32" height="32" alt="">Guarded<span>Berm</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto gap-lg-2"><li><a class="nav-link" href="dashboard.html">Dashboard</a></li><li><a class="nav-link" href="saferoute.html">Safe Route</a></li><li><a class="nav-link" href="report.html">Report Hazard</a></li><li><a class="nav-link active" href="feed.html">Hazard Feed</a></li><li><a class="nav-link" href="alerts.html">Alerts</a></li><li><a class="nav-link" href="profile.html">Profile</a></li></ul></div></nav>
<main class="container page-shell"><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"><div class="page-header"><p class="card-kicker mb-1">Public intelligence stream</p><h1 class="h2 fw-bold mb-0">Community hazard feed</h1></div><div class="d-flex gap-2"><select id="category-filter" class="form-select"><option value="">All categories</option><option>Flooding</option><option>Landslide</option><option>Fallen Tree</option><option>Road Blockage</option></select><select id="status-filter" class="form-select"><option value="">All statuses</option><option>Verified</option><option>Unverified</option></select></div></div><div id="feed-grid" class="row g-4"></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script><script>
  const { getReports, updateReport, deleteReport, getOwnerId, getCoords, haversineDistance, showToast, escapeHtml } = GuardedBerm;
  const grid = document.getElementById('feed-grid');
  function render() { const category = document.getElementById('category-filter').value; const status = document.getElementById('status-filter').value; const reports = getReports().filter(report => (!category || report.category === category) && (!status || report.status === status)); grid.innerHTML = reports.length ? reports.map(report => `<div class="col-12 col-md-6 col-lg-4"><article class="card-sharp p-4 h-100"><div class="d-flex justify-content-between gap-2"><span class="badge badge-risk-high">${escapeHtml(report.category.toUpperCase())}</span><span class="badge ${report.status === 'Verified' ? 'badge-verified' : 'badge-unverified'}">${escapeHtml(report.status)}</span></div><h2 class="h5 fw-bold mt-3">${escapeHtml(report.description)}</h2><p class="text-muted small">${new Date(report.timestamp).toLocaleString()}</p><div class="border-top pt-3 d-flex justify-content-between small text-muted"><span>${haversineDistance(getCoords().lat, getCoords().lon, report.lat, report.lon).toFixed(1)} km away</span><span>${report.upvotes} upvotes</span></div><div class="d-flex gap-2 mt-3"><button class="btn btn-outline-navy btn-sm upvote" data-id="${escapeHtml(report.id)}">Upvote</button>${report.ownerId === getOwnerId() ? `<button class="btn btn-outline-danger btn-sm delete-report" data-id="${escapeHtml(report.id)}">Delete</button>` : ''}</div></article></div>`).join('') : '<div class="col-12"><div class="card-sharp p-5 text-center text-muted empty-state">No hazard reports match these filters.</div></div>'; }
  grid.addEventListener('click', event => { const id = event.target.dataset.id; if (!id) return; if (event.target.classList.contains('upvote')) { const report = getReports().find(item => item.id === id); updateReport(id, { upvotes: report.upvotes + 1, status: report.upvotes + 1 > 3 ? 'Verified' : report.status }); render(); showToast('Community vote recorded.', 'success'); } if (event.target.classList.contains('delete-report')) { deleteReport(id); render(); showToast('Report removed.', 'success'); } });
  document.querySelectorAll('select').forEach(select => select.addEventListener('change', render)); window.addEventListener('storage', render); render();
</script></body></html>
