<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hazard Feed | GuardedBerm</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="logo.png" width="32" height="32" alt="">Guarded<span>Berm</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-lg-2">
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link" href="saferoute.html">Safe Route</a></li>
        <li><a class="nav-link" href="report.html">Report Hazard</a></li>
        <li><a class="nav-link active" href="feed.html">Hazard Feed</a></li>
        <li><a class="nav-link" href="alerts.html">Alerts</a></li>
        <li><a class="nav-link" href="profile.html">Profile</a></li>
      </ul>
    </div>
  </nav>

  <main class="container page-shell">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
      <div class="page-header">
        <p class="card-kicker mb-1">Public intelligence stream</p>
        <h1 class="h2 fw-bold mb-0">Community hazard feed</h1>
      </div>
      <div class="d-flex gap-2">
        <select id="category-filter" class="form-select">
          <option value="">All categories</option>
          <option>Flooding</option>
          <option>Landslide</option>
          <option>Fallen Tree</option>
          <option>Road Blockage</option>
        </select>
        <select id="status-filter" class="form-select">
          <option value="">All statuses</option>
          <option>Verified</option>
          <option>Unverified</option>
        </select>
      </div>
    </div>
    <div id="feed-grid" class="row g-4"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    const grid = document.getElementById('feed-grid');
    const userCoords = GuardedBerm.getCoords();
    const myId = GuardedBerm.getOwnerId();

    function renderFeed() {
      const catFilter = document.getElementById('category-filter').value;
      const statFilter = document.getElementById('status-filter').value;
      const reports = GuardedBerm.getReports().filter(r => (!catFilter || r.category === catFilter) && (!statFilter || r.status === statFilter));

      if (reports.length === 0) {
        grid.innerHTML = '<div class="col-12"><div class="card-sharp p-5 text-center text-muted">No hazard reports match these filters.</div></div>';
        return;
      }

      grid.innerHTML = reports.map(r => {
        const dist = GuardedBerm.haversineDistance(userCoords.lat, userCoords.lon, r.lat, r.lon).toFixed(1);
        const isOwner = r.ownerId === myId;
        return `
          <div class="col-12 col-md-6 col-lg-4">
            <article class="card-sharp p-4 d-flex flex-column">
              <div class="d-flex justify-content-between gap-2 mb-3">
                <span class="badge badge-risk-high">${r.category.toUpperCase()}</span>
                <span class="badge ${r.status === 'Verified' ? 'badge-verified' : 'badge-unverified'}">${r.status}</span>
              </div>
              <h2 class="h5 fw-bold">${r.description}</h2>
              <p class="text-muted small mb-3">${new Date(r.timestamp).toLocaleString()}</p>
              <div class="border-top pt-3 d-flex justify-content-between small text-muted mt-auto mb-3">
                <span>${dist} km away</span>
                <span>${r.upvotes} upvotes</span>
              </div>
              <div class="d-flex gap-2 mt-auto">
                <button class="btn btn-outline-navy btn-sm upvote-btn" data-id="${r.id}">Upvote</button>
                ${isOwner ? `<button class="btn btn-outline-danger btn-sm delete-btn" data-id="${r.id}">Delete</button>` : ''}
              </div>
            </article>
          </div>`;
      }).join('');
    }

    grid.addEventListener('click', (e) => {
      const id = e.target.dataset.id;
      if (!id) return;
      if (e.target.classList.contains('upvote-btn')) {
        const report = GuardedBerm.getReports().find(r => r.id === id);
        GuardedBerm.updateReport(id, { upvotes: report.upvotes + 1, status: (report.upvotes + 1 > 3) ? 'Verified' : report.status });
        renderFeed();
        GuardedBerm.showToast('Vote recorded.', 'success');
      }
      if (e.target.classList.contains('delete-btn')) {
        if (confirm('Are you sure you want to delete this report?')) {
          GuardedBerm.deleteReport(id);
          renderFeed();
          GuardedBerm.showToast('Report removed.', 'success');
        }
      }
    });

    document.querySelectorAll('select').forEach(select => select.addEventListener('change', renderFeed));
    renderFeed();
  </script>
</body>
</html>
