<main class="container page-shell"><div class="row justify-content-center"><div class="col-12 col-lg-7"><div class="page-header mb-4"><p class="card-kicker mb-1">Community intelligence</p><h1 class="h2 fw-bold mb-0">Submit a hazard report</h1></div><div class="card-sharp p-4 p-md-5"><p class="text-muted">Share a ground observation so responders can update the live risk map.</p><form onsubmit="event.preventDefault(); document.getElementById('report-status').textContent='Report submitted for verification.'"><label class="form-label fw-semibold" for="category">Category</label><select id="category" class="form-select mb-3" required><option value="" selected disabled>Choose hazard type</option><option>Flooding</option><option>Landslide</option><option>Fallen Tree</option><option>Road Blockage</option></select><label class="form-label fw-semibold" for="gps">GPS location</label><div class="input-group mb-3"><input id="gps" class="form-control" value="33.7833° N, 72.7167° E" required><button class="btn btn-outline-navy" type="button">Use my location</button></div><label class="form-label fw-semibold" for="description">Description</label><textarea id="description" class="form-control mb-3" rows="5" placeholder="Describe severity, access restrictions, or immediate danger." required></textarea><label class="form-label fw-semibold" for="photo">Photo attachment <span class="text-muted fw-normal">(optional)</span></label><input id="photo" class="form-control mb-4" type="file" accept="image/*"><button class="btn btn-accent w-100 py-3" type="submit">Submit hazard report</button><p id="report-status" class="text-success fw-semibold mt-3 mb-0" aria-live="polite"></p></form></div></div></div></main>
