<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Hazard | GuardedBerm</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="logo.png" width="32" height="32" alt="">Guarded<span>Berm</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-lg-2">
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link" href="saferoute.html">Safe Route</a></li>
        <li><a class="nav-link active" href="report.html">Report Hazard</a></li>
        <li><a class="nav-link" href="feed.html">Hazard Feed</a></li>
        <li><a class="nav-link" href="alerts.html">Alerts</a></li>
        <li><a class="nav-link" href="profile.html">Profile</a></li>
      </ul>
    </div>
  </nav>

  <main class="container page-shell">
    <div class="page-header mb-4">
      <p class="card-kicker mb-1">Community intelligence</p>
      <h1 class="h2 fw-bold mb-0">Submit a hazard report</h1>
    </div>

    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <div class="card-sharp p-4">
          <form id="report-form">
            <label class="form-label fw-semibold">Category</label>
            <select id="category" class="form-select mb-3" required>
              <option value="" disabled selected>Choose hazard type</option>
              <option>Flooding</option>
              <option>Landslide</option>
              <option>Fallen Tree</option>
              <option>Road Blockage</option>
            </select>
            <label class="form-label fw-semibold">GPS Location</label>
            <input id="gps" class="form-control mb-2" placeholder="Latitude, Longitude" required>
            <button id="use-location" class="btn btn-outline-navy btn-sm mb-3" type="button">Use my location</button>
            <button id="reverse-location" class="btn btn-outline-navy btn-sm mb-3 ms-2" type="button">Name this location</button>
            <div id="location-name" class="small text-muted mb-3"></div>
            <label class="form-label fw-semibold">Description</label>
            <textarea id="description" class="form-control mb-3" rows="4" required placeholder="Describe severity, access restrictions, etc."></textarea>
            <label class="form-label fw-semibold">Photo <span class="text-muted fw-normal">(optional)</span></label>
            <input id="photo" class="form-control mb-4" type="file" accept="image/*">
            <button class="btn btn-accent w-100 py-3" type="submit">Save hazard report</button>
            <p id="report-status" class="text-success fw-semibold mt-3 mb-0"></p>
          </form>
        </div>
      </div>
      <div class="col-12 col-lg-7">
        <div class="map-frame"><div id="map"></div></div>
        <p class="small text-muted mt-2">Click the map or drag the pin to set the exact GPS location.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
  <script>
    (async function () {
      const initialCoords = GuardedBerm.getCoords();
      const map = await MapKit.getMap('map');
      if (!map) { console.error('Map failed'); return; }

      let marker = L.marker([initialCoords.lat, initialCoords.lon], { draggable: true }).addTo(map);
      function updatePin(lat, lon) {
        marker.setLatLng([lat, lon]);
        document.getElementById('gps').value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      }
      updatePin(initialCoords.lat, initialCoords.lon);

      marker.on('dragend', () => { const pos = marker.getLatLng(); updatePin(pos.lat, pos.lng); });
      map.on('click', (e) => updatePin(e.latlng.lat, e.latlng.lng));

      document.getElementById('use-location').addEventListener('click', () => {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 16);
          updatePin(latitude, longitude);
        }, () => GuardedBerm.showToast('GPS access denied.', 'danger'));
      });

      document.getElementById('reverse-location').addEventListener('click', async () => {
        try {
          const [lat, lon] = document.getElementById('gps').value.split(',').map(Number);
          if (isNaN(lat) || isNaN(lon)) throw new Error('Invalid GPS coordinates.');
          document.getElementById('location-name').textContent = await GuardedBerm.reverseGeocode(lat, lon);
        } catch (err) { GuardedBerm.showToast(err.message, 'danger'); }
      });

      document.getElementById('report-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const [lat, lon] = document.getElementById('gps').value.split(',').map(Number);
        if (isNaN(lat) || isNaN(lon)) return GuardedBerm.showToast('Invalid coordinates.', 'danger');
        GuardedBerm.createReport({
          category: document.getElementById('category').value,
          description: document.getElementById('description').value.trim(),
          lat, lon
        });
        document.getElementById('report-status').textContent = 'Report saved locally and awaiting verification.';
        e.target.reset();
        updatePin(lat, lon);
      });
    })();
  </script>
</body>
</html>
