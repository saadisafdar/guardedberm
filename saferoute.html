<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Safe Route | GuardedBerm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3"><a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="image_1.png" width="32" height="32" alt="">Guarded<span>Berm</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto gap-lg-2"><li><a class="nav-link" href="dashboard.html">Dashboard</a></li><li><a class="nav-link active" href="saferoute.html">Safe Route</a></li><li><a class="nav-link" href="report.html">Report Hazard</a></li><li><a class="nav-link" href="feed.html">Hazard Feed</a></li><li><a class="nav-link" href="alerts.html">Alerts</a></li><li><a class="nav-link" href="profile.html">Profile</a></li></ul></div></nav>
<main class="container-fluid page-shell px-3 px-lg-4"><div class="page-header mb-4"><p class="card-kicker mb-1">Navigation intelligence</p><h1 class="h2 fw-bold mb-0">Hazard-aware routing</h1></div><div class="row g-4"><section class="col-12 col-lg-4"><div class="card-sharp p-4"><form id="route-form"><label class="form-label fw-semibold" for="start">Start address</label><input id="start" class="form-control mb-2" placeholder="Home or current address" required><button id="use-home" class="btn btn-outline-navy btn-sm mb-3" type="button">Use saved home</button><label class="form-label fw-semibold" for="destination">Destination address</label><input id="destination" class="form-control mb-3" placeholder="Enter target destination" required><button class="btn btn-accent w-100 py-2 mb-3" type="submit">Calculate driving route</button><div id="route-status" class="small text-muted" aria-live="polite"></div></form><div id="route-result" class="mt-4"></div></div></section><section class="col-12 col-lg-8"><div class="d-flex justify-content-end mb-2"><button id="live-location" class="btn btn-outline-navy btn-sm">Use My Live Location</button></div><div id="map"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script><script>
  const { getCoords, geocodeAddress, showToast, setLoading } = GuardedBerm;
  const home = getCoords(); const map = L.map('map').setView([home.lat, home.lon], 12); const base = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' }).addTo(map); const routeLayer = L.layerGroup().addTo(map); let liveMarker;
  document.getElementById('use-home').addEventListener('click', () => { document.getElementById('start').value = `${home.lat}, ${home.lon}`; map.setView([home.lat, home.lon], 13); });
  document.getElementById('live-location').addEventListener('click', () => navigator.geolocation.getCurrentPosition(position => { map.setView([position.coords.latitude, position.coords.longitude], 15); if (liveMarker) liveMarker.setLatLng([position.coords.latitude, position.coords.longitude]); else liveMarker = L.marker([position.coords.latitude, position.coords.longitude]).addTo(map); document.getElementById('start').value = `${position.coords.latitude}, ${position.coords.longitude}`; }, () => showToast('Unable to access your live location.')));
  document.getElementById('route-form').addEventListener('submit', async event => { event.preventDefault(); const button = event.target.querySelector('button[type="submit"]'); setLoading(button, true, 'Geocoding...'); try { const start = await geocodeAddress(document.getElementById('start').value); const destination = await geocodeAddress(document.getElementById('destination').value); const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${destination.lon},${destination.lat}?geometries=geojson&overview=full`; const data = await fetch(url).then(response => { if (!response.ok) throw new Error('Routing service failed.'); return response.json(); }); if (!data.routes?.[0]) throw new Error('No driving route found.'); const route = data.routes[0]; routeLayer.clearLayers(); const line = L.geoJSON(route.geometry, { style: { color: '#F97316', weight: 5 } }).addTo(routeLayer); map.fitBounds(line.getBounds(), { padding: [20, 20] }); document.getElementById('route-result').innerHTML = `<div class="border p-3"><strong>Live OSRM route</strong><div class="small text-muted mt-2">${(route.distance / 1000).toFixed(1)} km · ${Math.round(route.duration / 60)} min driving</div></div>`; document.getElementById('route-status').textContent = 'Route updated from live geocoding and OSRM data.'; } catch (error) { document.getElementById('route-status').textContent = 'Route unavailable.'; showToast(error.message); } finally { setLoading(button, false); } });
  L.control.layers({ 'Street map': base }, { 'Calculated route': routeLayer }).addTo(map); setTimeout(() => map.invalidateSize(), 300);
</script></body></html>
