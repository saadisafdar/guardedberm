<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safe Route | GuardedBerm</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 px-lg-4 py-3">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html"><img src="logo.png" width="32" height="32" alt="">Guarded<span>Berm</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-lg-2">
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link active" href="saferoute.html">Safe Route</a></li>
        <li><a class="nav-link" href="report.html">Report Hazard</a></li>
        <li><a class="nav-link" href="feed.html">Hazard Feed</a></li>
        <li><a class="nav-link" href="alerts.html">Alerts</a></li>
        <li><a class="nav-link" href="profile.html">Profile</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-shell px-3 px-lg-4">
    <div class="page-header mb-4">
      <p class="card-kicker mb-1">Navigation intelligence</p>
      <h1 class="h2 fw-bold mb-0">Hazard-aware routing</h1>
    </div>

    <div class="row g-4">
      <section class="col-12 col-lg-4">
        <div class="card-sharp p-4">
          <form id="route-form">
            <label class="form-label fw-semibold">Start address</label>
            <input id="start" class="form-control mb-2" placeholder="Home or current address" required>
            <button id="use-home" class="btn btn-outline-navy btn-sm mb-3" type="button">Use saved home</button>
            <label class="form-label fw-semibold">Destination address</label>
            <input id="destination" class="form-control mb-3" placeholder="Enter target destination" required>
            <button class="btn btn-accent w-100 py-2 mb-3" type="submit">Calculate driving route</button>
            <div id="route-status" class="small text-muted"></div>
          </form>
          <div id="route-result" class="mt-4"></div>
        </div>
      </section>
      <section class="col-12 col-lg-8">
        <div class="d-flex flex-wrap justify-content-end gap-2 mb-2">
          <button id="set-start" class="btn btn-outline-navy btn-sm" type="button">Set Start on Map</button>
          <button id="set-destination" class="btn btn-outline-navy btn-sm" type="button">Set Destination on Map</button>
          <button id="live-location" class="btn btn-outline-navy btn-sm" type="button">Use My Location</button>
        </div>
        <div class="map-frame"><div id="map"></div></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
  <script>
    (async function () {
      const home = GuardedBerm.getCoords();
      const map = await MapKit.getMap('map');
      if (!map) { console.error('Map failed'); return; }

      const routeLayer = L.layerGroup().addTo(map);
      const hazardLayer = L.layerGroup().addTo(map);
      let startPt, destPt, startMarker, destMarker, selectingMode = null;

      GuardedBerm.getReports().filter(r => r.status === 'Verified').forEach(r => {
        L.circle([r.lat, r.lon], { radius: 5000, color: '#C62828', fillOpacity: .1 }).addTo(hazardLayer);
        L.marker([r.lat, r.lon]).bindPopup(`<strong>${r.category}</strong><br>${r.description}`).addTo(hazardLayer);
      });

      function setMarker(type, lat, lon) {
        const pos = [lat, lon];
        if (type === 'start') {
          startPt = { lat, lon };
          if (startMarker) startMarker.setLatLng(pos);
          else {
            startMarker = L.marker(pos, { draggable: true }).addTo(map);
            startMarker.on('dragend', () => {
              const p = startMarker.getLatLng();
              startPt = { lat: p.lat, lon: p.lng };
              document.getElementById('start').value = `${p.lat}, ${p.lng}`;
              checkRoute();
            });
          }
        } else {
          destPt = { lat, lon };
          if (destMarker) destMarker.setLatLng(pos);
          else {
            destMarker = L.marker(pos, { draggable: true }).addTo(map);
            destMarker.on('dragend', () => {
              const p = destMarker.getLatLng();
              destPt = { lat: p.lat, lon: p.lng };
              document.getElementById('destination').value = `${p.lat}, ${p.lng}`;
              checkRoute();
            });
          }
        }
      }

      async function checkRoute() { if (startPt && destPt) await calculateRoute(startPt, destPt); }

      async function calculateRoute(start, dest) {
        const btn = document.querySelector('#route-form button[type="submit"]');
        GuardedBerm.setLoading(btn, true, 'Routing...');
        document.getElementById('route-status').textContent = '';
        routeLayer.clearLayers();
        try {
          const url = `https://router.project-osrm.org/route/v1/driving/${start.lon},${start.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&alternatives=true`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.code !== 'Ok' || !data.routes.length) throw new Error('No route found.');
          const directRoute = data.routes[0];
          const hazards = GuardedBerm.getReports().filter(r => r.status === 'Verified');
          const directHasHazard = directRoute.geometry.coordinates.some(([lon, lat]) => hazards.some(h => GuardedBerm.haversineDistance(lat, lon, h.lat, h.lon) <= 5));

          const directLine = L.geoJSON(directRoute.geometry, { style: { color: directHasHazard ? '#C62828' : '#2563EB', weight: 5, dashArray: directHasHazard ? '10 8' : null } }).addTo(routeLayer);
          const safeRoute = data.routes.slice(1).find(r => !r.geometry.coordinates.some(([lon, lat]) => hazards.some(h => GuardedBerm.haversineDistance(lat, lon, h.lat, h.lon) <= 5)));
          if (safeRoute) L.geoJSON(safeRoute.geometry, { style: { color: '#5E9B9A', weight: 5 } }).addTo(routeLayer);
          map.fitBounds(directLine.getBounds(), { padding: [20, 20] });

          const riskScore = Math.min(100, (directHasHazard ? 55 : 10) + (hazards.length * 5));
          let html = `<div class="border p-3"><strong>Fastest Route</strong><div class="small text-muted">${(directRoute.distance / 1000).toFixed(1)} km · ${Math.round(directRoute.duration / 60)} min</div>${directHasHazard ? '<span class="text-danger small fw-bold">⚠️ Crosses hazard buffer</span>' : ''}`;
          if (safeRoute) html += `<hr class="my-2"><strong class="text-success">Safe Detour</strong><div class="small text-muted">${(safeRoute.distance / 1000).toFixed(1)} km · ${Math.round(safeRoute.duration / 60)} min</div>`;
          html += `<div class="mt-2"><strong>Risk Score:</strong> ${Math.round(riskScore)} / 100</div></div>`;
          document.getElementById('route-result').innerHTML = html;
        } catch (e) {
          document.getElementById('route-status').textContent = 'Route unavailable.';
          GuardedBerm.showToast(e.message, 'danger');
        } finally {
          GuardedBerm.setLoading(btn, false);
        }
      }

      document.getElementById('route-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const start = await GuardedBerm.geocodeAddress(document.getElementById('start').value);
          const dest = await GuardedBerm.geocodeAddress(document.getElementById('destination').value);
          setMarker('start', start.lat, start.lon);
          setMarker('destination', dest.lat, dest.lon);
          await calculateRoute(start, dest);
        } catch (err) { GuardedBerm.showToast(err.message, 'danger'); }
      });

      document.getElementById('set-start').addEventListener('click', () => { selectingMode = 'start'; });
      document.getElementById('set-destination').addEventListener('click', () => { selectingMode = 'dest'; });

      map.on('click', async (e) => {
        if (!selectingMode) return;
        const { lat, lng } = e.latlng;
        setMarker(selectingMode, lat, lng);
        try {
          const address = await GuardedBerm.reverseGeocode(lat, lng);
          document.getElementById(selectingMode === 'start' ? 'start' : 'destination').value = address;
          checkRoute();
        } catch (err) { console.error(err); }
        selectingMode = null;
      });

      document.getElementById('use-home').addEventListener('click', () => {
        document.getElementById('start').value = `${home.lat}, ${home.lon}`;
        setMarker('start', home.lat, home.lon);
        map.setView([home.lat, home.lon], 13);
      });

      document.getElementById('live-location').addEventListener('click', () => {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          setMarker('start', latitude, longitude);
          document.getElementById('start').value = `${latitude}, ${longitude}`;
          map.setView([latitude, longitude], 15);
        }, () => GuardedBerm.showToast('GPS access denied.', 'danger'));
      });
    })();
  </script>
</body>
</html>
